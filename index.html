<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vent 파형 도감</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="파형 도감">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0B1120">
<style>
:root{
  --bg:#EEF1F6; --surface:#FFFFFF; --ink:#141B2B; --muted:#5B6578; --line:#D6DCE6;
  --accent:#3559C7; --accent-ink:#FFFFFF; --accent-soft:#E3E9FA;
  --ok:#1C7A4B; --ok-soft:#E2F3E9; --bad:#B3261E; --bad-soft:#FBE8E6;
  --sans:-apple-system, "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --mono:ui-monospace, "SF Mono", Menlo, monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#0B1120; --surface:#131B2E; --ink:#E5EAF3; --muted:#94A0B6; --line:#26314A;
  --accent:#8FA8FF; --accent-ink:#0B1120; --accent-soft:#1D2A4D;
  --ok:#5DCB91; --ok-soft:#14301F; --bad:#FF8B80; --bad-soft:#3A1D1B; color-scheme:dark}}
[hidden]{display:none!important}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.55;
  padding-top:calc(env(safe-area-inset-top,0px) + 12px);padding-bottom:calc(env(safe-area-inset-bottom,0px) + 32px);
  padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px))}
.wrap{max-width:980px;margin:0 auto;display:grid;gap:14px}
header{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
h1{font-size:1.3rem;margin:0}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:3px}
.seg button{background:transparent;color:var(--muted);border:0;padding:7px 14px;border-radius:7px;font-weight:600}
.seg button.on{background:var(--accent);color:var(--accent-ink)}
button{font:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:6px 12px;font-size:.85rem;font-weight:600;white-space:nowrap}
.chip small{color:var(--muted);font-weight:500;margin-left:4px}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip.on small{color:inherit;opacity:.8}

.monitor{background:#070B14;border-radius:14px;padding:12px 12px 8px;color:#C9D3E6;border:1px solid #1B2438}
.mon-head{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:baseline;justify-content:space-between;margin-bottom:6px;font-family:var(--mono);font-size:.8rem}
.mode{color:#fff;font-weight:700;background:#1E2A44;border-radius:6px;padding:2px 8px}
.readout{display:flex;flex-wrap:wrap;gap:4px 14px}
.readout span b{color:#fff;font-weight:600}
.readout .hid{color:#EB8CE0}
canvas{display:block;width:100%;touch-action:pan-y}
.mon-foot{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.tg{border:1px solid #2A3654;background:#0F1626;color:#C9D3E6;border-radius:8px;padding:6px 10px;font-size:.82rem;font-weight:600}
.tg.on{background:#22305A;border-color:#5C78D6;color:#fff}
.tg .sw{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:0}

.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;display:grid;gap:14px}
@media (max-width:480px){.card{padding:15px 13px}}
.title{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px}
h2{font-size:1.2rem;margin:0}
.en{color:var(--muted);font-size:.85rem}
.tag{font-family:var(--mono);font-size:.72rem;border:1px solid var(--line);border-radius:5px;padding:1px 6px;color:var(--muted)}
.one{margin:0;font-weight:600}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.sec{display:grid;gap:6px;align-content:start}
h3{font-size:.74rem;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin:0}
.sec ul,.sec ol{margin:0;padding-left:1.15em;display:grid;gap:3px}
.sec.fix ol li::marker{color:var(--accent);font-weight:700}
.pit{background:var(--bad-soft);border-radius:10px;padding:10px 12px;font-size:.9rem}
.pit b{color:var(--bad)}
.nav{display:flex;justify-content:space-between;gap:8px}
.btn{border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:9px;padding:10px 14px;font-weight:600}
.btn.go{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn:disabled{opacity:.35}
.quizq{font-weight:700;font-size:1.05rem;margin:0}
.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px}
.choice{text-align:left;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:11px 13px;font-weight:600}
.choice.right{border-color:var(--ok);background:var(--ok-soft)}
.choice.wrong{border-color:var(--bad);background:var(--bad-soft)}
.score{font-family:var(--mono);font-size:.85rem;color:var(--muted)}
.hint{font-size:.82rem;color:var(--muted);margin:0}
#asvBox{border-top:1px solid #1B2438;margin-top:8px;padding-top:8px}
.asv-cap{font-family:var(--mono);font-size:.78rem;color:#C9D3E6;display:flex;flex-wrap:wrap;gap:4px 14px;margin-bottom:4px}
.asv-cap b{color:#fff}
.sec.good h3{color:var(--ok)} .sec.bad h3{color:var(--bad)}
.how{background:var(--accent-soft);border-radius:10px;padding:10px 12px;font-size:.9rem}
.how ul{margin:4px 0 0;padding-left:1.1em}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* ---------- Hold 측정 탭 ---------- */
:root{--warn:#A35F00}
@media (prefers-color-scheme: dark){:root{--warn:#F2B35B}}
.tblw{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;font-size:.88rem}
.tbl th,.tbl td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl th{font-size:.7rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.tbl td:first-child{white-space:nowrap;font-weight:700}
.tbl td:nth-child(2){white-space:nowrap;font-family:var(--mono)}
.lv{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:1px}
.lv.ok{background:var(--ok)}.lv.warn{background:var(--warn)}.lv.bad{background:var(--bad)}
.fx{font-family:var(--mono);font-size:.85rem;background:var(--bg);border-radius:8px;padding:9px 11px;display:grid;gap:4px}
.calc-in{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
@media (min-width:600px){.calc-in{grid-template-columns:repeat(4,minmax(0,1fr))}}
.calc-in label{display:grid;gap:3px;font-size:.8rem;color:var(--muted);font-weight:700}
.calc-in label small{font-weight:500}
.calc-in input{font:inherit;font-size:1.1rem;font-family:var(--mono);padding:9px 10px;border:1.5px solid var(--line);border-radius:9px;background:var(--bg);color:var(--ink);width:100%}
.calc-in input:focus{outline:2px solid var(--accent);outline-offset:0;border-color:var(--accent)}
.res{display:grid;gap:7px}
.res-row{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:baseline;padding:9px 12px;border-radius:10px;border-left:4px solid var(--line);background:var(--bg)}
.res-row.ok{border-left-color:var(--ok)}.res-row.warn{border-left-color:var(--warn)}.res-row.bad{border-left-color:var(--bad)}
.res-row .nm{font-weight:700}
.res-row b{font-family:var(--mono);font-size:1.15rem}
.res-row b small{font-size:.75rem;color:var(--muted);font-weight:500;margin-left:3px}
.res-row .ms{grid-column:1/-1;font-size:.86rem;color:var(--muted)}
.res-row.ok .ms{color:var(--ok)}.res-row.warn .ms{color:var(--warn)}.res-row.bad .ms{color:var(--bad)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Vent 파형 도감</h1>
    <div class="seg" role="tablist">
      <button type="button" data-tab="atlas" class="on">도감</button>
      <button type="button" data-tab="quiz">퀴즈</button>
      <button type="button" data-tab="adv">Advanced</button>
      <button type="button" data-tab="hold">Hold 측정</button>
    </div>
  </header>

  <div class="chips" id="chips"></div>

  <section class="monitor" aria-label="인공호흡기 파형">
    <div class="mon-head">
      <span class="mode" id="mode">PSV</span>
      <div class="readout" id="readout"></div>
    </div>
    <canvas id="cv" height="300"></canvas>
    <div id="asvBox" hidden><div class="asv-cap" id="asvCap"></div><canvas id="asv" height="200"></canvas><div class="mon-foot" id="lungs"></div></div>
    <div class="mon-foot">
      <button type="button" class="tg" id="tgAnn"><span class="sw" style="background:#FF6B6B"></span>단서 표시</button>
      <button type="button" class="tg" id="tgPmus"><span class="sw" style="background:#EB8CE0"></span>환자 effort (Pmus)</button>
      <button type="button" class="tg" id="tgReplay">▶ 다시 그리기</button>
    </div>
  </section>

  <section class="card" id="info"></section>
</div>

<script>
(function(){
/* ---------- physiology simulator: single-compartment lung + patient Pmus + ventilator logic ---------- */
function rng(seed){let s=seed>>>0;return()=>{s=(s*1664525+1013904223)>>>0;return s/4294967296}}
function simulate(cfg){
  const p=Object.assign({mode:'PSV',R:10,C:0.05,PEEP:5,P:10,Ti:1.0,RR:0,ETS:0.25,rise:0.08,trig:0.033,Rv:1.2,pCycle:3,
    card:0,HR:100,dur:16,show:10,eff:null,entrain:null,seed:7,lag:0.03,refr:0.12,Rexp:1.5},cfg);
  const dt=0.004, efforts=[], breaths=[];
  if(p.eff){const r=rng(p.seed);let t=p.eff.first??0.6;while(t<p.dur){efforts.push({s:t,Ti:p.eff.Ti,A:p.eff.A,relax:p.eff.relax??0.35,ex:p.eff.ex||0,exDur:p.eff.exDur||0.6});t+=p.eff.period*(1+(p.eff.jitter||0)*(r()-0.5)*2)}}
  const pmusAt=t=>{let s=0;for(const e of efforts){const u=t-e.s;if(u<0||u>e.Ti+Math.max(e.relax,e.exDur)+0.05)continue;
      if(u<e.Ti)s+=e.A*Math.sin(Math.PI/2*u/e.Ti);else if(u<e.Ti+e.relax)s+=e.A*Math.cos(Math.PI/2*(u-e.Ti)/e.relax);
      if(e.ex&&u>=e.Ti&&u<e.Ti+e.exDur)s-=e.ex*Math.sin(Math.PI*(u-e.Ti)/e.exDur);}return s};
  let V=0,phase='exp',tI=0,tE=-1,peak=0,tLast=-99,cur=null,pend=null;
  const T=[],PAW=[],FLOW=[],VOL=[],PM=[];
  const startInsp=(t,type)=>{phase='insp';pend=null;tI=t;tLast=t;peak=0;cur={s:t,type,v0:V};breaths.push(cur);
    if(p.entrain&&type==='time')efforts.push({s:t+p.entrain.delay,Ti:p.entrain.Ti,A:p.entrain.A,relax:0.3,ex:0,exDur:0,entrained:true});};
  const endInsp=(t,why)=>{phase='exp';tE=t;cur.e=t;cur.vt=V-cur.v0;cur.why=why;cur.peak=peak};
  for(let i=0,t=0;t<p.dur;i++,t=i*dt){
    const pm=pmusAt(t), Palv=p.PEEP+V/p.C-pm;
    let paw,flow;
    if(phase==='exp'){
      flow=(p.PEEP-Palv)/(p.R+p.Rexp);paw=p.PEEP-p.Rexp*flow;
      const meas=flow+p.card*Math.sin(2*Math.PI*p.HR/60*t);
      if(p.trig>0&&t-tE>p.refr&&meas>p.trig) startInsp(t,'trig');
      else if(p.RR>0&&t-tLast>=60/p.RR) startInsp(t,'time');
      flow=meas;
    }else{
      const ti=t-tI,target=p.PEEP+p.P,cmd=p.PEEP+p.P*Math.min(1,ti/p.rise);
      flow=(cmd-Palv)/(p.R+p.Rv);paw=cmd-p.Rv*flow;if(flow<0){flow=0;paw=Palv}
      if(flow>peak)peak=flow;
      if(p.mode==='PCV'){if(ti>=p.Ti)endInsp(t,'time')}
      else{if(pend===null&&((ti>0.12&&flow<p.ETS*peak)||ti>3))pend=t+p.lag;if(pend!==null&&t>=pend)endInsp(t,'flow')}
      if(phase==='insp'&&paw>target+p.pCycle)endInsp(t,'pressure');
      if(p.card)flow+=p.card*Math.sin(2*Math.PI*p.HR/60*t);
    }
    V+=( (phase==='insp'||true)? (flow-(p.card?p.card*Math.sin(2*Math.PI*p.HR/60*t):0)) :0)*dt;
    if(i%2===0){T.push(t);PAW.push(paw);FLOW.push(flow*60);VOL.push(V*1000);PM.push(pm)}
  }
  if(cur&&cur.e===undefined){cur.e=p.dur;cur.vt=V-cur.v0}
  // classify
  for(const b of breaths){if(b.type==='trig'){b.eff=efforts.find(e=>b.s>=e.s-0.02&&b.s<=e.s+e.Ti+0.2);if(!b.eff)b.type='auto'}}
  for(const e of efforts){e.trig=breaths.find(b=>b.type!=='time'&&b.s>=e.s-0.02&&b.s<=e.s+e.Ti);
    e.inInsp=breaths.some(b=>e.s>b.s&&e.s<b.e);}
  const t0=p.dur-p.show;
  return {p,T,PAW,FLOW,VOL,PM,efforts,breaths,t0,t1:p.dur};
}

/* ---------- scenarios ---------- */
const S=[
{id:'normal-psv',name:'정상 PSV',en:'Normal pressure support',mode:'PSV',
 cfg:{mode:'PSV',R:10,C:0.05,P:10,PEEP:5,ETS:0.25,eff:{period:4,Ti:1.0,A:5}},
 one:'비교 기준이 되는 정상 PSV 파형이야.',
 clues:['환자 effort 1번 = breath 1번','Paw: 설정 압력까지 빠르게 올라가서 평평한 사각형','흡기 flow: 빠르게 peak → 감속 → peak의 25%에서 종료','호기 flow: 다음 흡기 전에 0으로 복귀'],
 cause:[],fix:[],pit:null,ann:()=>[]},
{id:'normal-pcv',name:'정상 PCV',en:'Normal pressure control (passive)',mode:'PCV',
 cfg:{mode:'PCV',R:10,C:0.05,P:15,PEEP:5,Ti:1.0,RR:15,trig:0.033},
 one:'환자 effort 없는 passive PCV 파형이야.',
 clues:['Breath 간격이 설정 RR대로 일정','Paw: 사각형, Ti 동안 유지','흡기 flow: Ti 끝 전에 0에 도달 (흡기 끝 flow 0 = Ppeak ≈ Pplat)','호기 flow: 다음 breath 전에 0으로 복귀'],
 cause:[],fix:[],pit:null,ann:()=>[]},
{id:'ineffective',name:'Ineffective effort',en:'Missed trigger · wasted effort',mode:'PSV',
 cfg:{mode:'PSV',R:20,C:0.06,P:16,PEEP:5,ETS:0.25,eff:{period:1.9,Ti:0.6,A:6,jitter:0.05},seed:3},
 one:'환자는 숨을 쉬려 했는데 기계가 못 알아챈 거야. 가장 흔한 PVD야.',
 clues:['호기 flow가 0으로 안 돌아오고 다음 breath가 시작됨 → auto-PEEP','호기 flow 중간에 위(0 쪽)로 튀는 notch + 같은 시점 Paw 미세 dip, breath는 없음','흉곽 움직임 수 > 화면 RR'],
 cause:['Auto-PEEP: COPD·천식, 큰 Vt, 높은 PS, 긴 Ti','과진정, 약한 흡기근','Trigger가 너무 둔함'],
 fix:['PS 낮추기 → Vt↓, 호기 시간 확보','ETS 올리기 (COPD 40–50%) → Ti↓ Te↑','External PEEP = 측정 auto-PEEP의 약 80%','Trigger 예민하게','진정 줄이기'],
 pit:'<b>PS를 올리면 더 나빠져.</b> 교정 후 화면 RR이 오르는 건 버려지던 effort가 인식된 거라 호전이야.',
 ann:A=>A.missed('missed')},
{id:'delay',name:'Trigger delay',en:'Delayed triggering',mode:'PSV',
 cfg:{mode:'PSV',R:22,C:0.06,P:14,PEEP:5,ETS:0.3,trig:0.05,eff:{period:2.6,Ti:1.0,A:8},seed:5},
 one:'환자 effort가 시작되고 한참 뒤에야 기계가 반응해.',
 clues:['흡기 직전 호기 flow가 0으로 서서히 올라오는 "끌어당기는" 구간','흡기 시작 직전 Paw가 PEEP 아래로 dip','Pmus를 켜 보면 effort 시작과 flow 시작 사이 간격이 보임'],
 cause:['Auto-PEEP (threshold load)','Trigger sensitivity 둔함 (flow 5 L/min 등)','약한 effort, 회로 leak'],
 fix:['Trigger 예민하게 (flow 1–2 L/min)','Auto-PEEP 있으면 ext PEEP, PS↓, ETS↑','진정 줄이기'],
 pit:'Delay가 길어지면 결국 ineffective effort가 돼. 같은 스펙트럼이야.',
 ann:A=>A.delay()},
{id:'auto',name:'Auto-triggering',en:'Auto-trigger',mode:'PCV',
 cfg:{mode:'PCV',R:8,C:0.05,P:10,PEEP:5,Ti:0.8,RR:12,trig:0.02,card:0.09,HR:96},
 one:'환자 effort 없이 기계가 스스로 breath를 줘.',
 clues:['Breath 직전 Paw dip(환자 effort 흔적)이 없음','호기 끝 flow에 심박 리듬의 잔물결','설정 RR보다 훨씬 빠르고 규칙적인 RR'],
 cause:['Trigger 과민','Leak: cuff, chest tube bubbling, 회로 분리','회로 내 물(condensate)','Cardiac oscillation: 낮은 drive + 큰 심박출량'],
 fix:['회로 점검 · 물 제거 · leak 확인','Trigger 둔하게','Flow trigger → pressure trigger','Leak compensation 켜기'],
 pit:'<b>뇌사 apnea test에서 자발호흡으로 오인</b>하는 고전적 함정. 과환기·알칼리증도 생겨.',
 ann:A=>A.auto()},
{id:'starve',name:'Flow starvation',en:'Flow asynchrony · under-assist',mode:'PSV',
 cfg:{mode:'PSV',R:8,C:0.04,P:7,PEEP:5,ETS:0.35,rise:0.5,Rv:8,eff:{period:2.4,Ti:1.0,A:22,relax:0.8}},
 one:'환자 요구 flow > 기계가 주는 flow. 환자가 일을 다 하고 있어.',
 clues:['흡기 초 Paw가 PEEP 아래로 떨어진 뒤 오목하게(scooped) 늦게 올라감','흡기 flow가 처음보다 나중에 커짐 (환자가 끌어당김)','빈호흡, 보조근 사용'],
 cause:['Rise time 너무 김','PS/Pinsp 낮음','높은 drive: 산증, 통증, 열, 불안'],
 fix:['Rise time 짧게','PS(Pinsp) 올리기','Drive 교정','지속되면 PAV+ / NAVA'],
 pit:'VCV라면 peak flow↑ 또는 PC/PS 전환. 단, flow만 올리면 Ti가 짧아져 double trigger로 넘어갈 수 있어.',
 ann:A=>A.starve()},
{id:'premature',name:'Premature cycling',en:'Ventilator Ti < neural Ti',mode:'PSV',
 cfg:{mode:'PSV',R:8,C:0.025,P:12,PEEP:8,ETS:0.5,eff:{period:3,Ti:1.1,A:4.5}},

/* ---------- advanced-mode simulator ---------- */
function simAdv(cfg){
  const p=Object.assign({mode:'PRVC',R:10,C:0.05,Cfn:null,PEEP:5,RR:15,Ti:1.0,ETS:0.25,rise:0.08,trig:0.033,Rv:1.0,Rexp:1.5,VtT:0.5,P0:10,Pmax:35,Pmin:2,
    g:0.7,level:2.0,nme:0.8,minFlow:0.4,apnea:5,lag:0.03,refr:0.15,pct:100,ibw:70,dur:24,show:18,effs:[]},cfg);
  const dt=0.004,efforts=[],breaths=[];let asv=null;
  for(const g of p.effs){let k=0;for(let t=g.from;t<Math.min(g.to,p.dur);t+=g.period,k++){const A=Array.isArray(g.A)?g.A[Math.min(k,g.A.length-1)]:g.A;efforts.push({s:t,Ti:g.Ti,A,relax:0.35})}}
  const drive=t=>{let s=0;for(const e of efforts){const u=t-e.s;if(u<0||u>e.Ti+e.relax)continue;s+=u<e.Ti?e.A*Math.sin(Math.PI/2*u/e.Ti):e.A*Math.cos(Math.PI/2*(u-e.Ti)/e.relax)}return s};
  if(p.mode==='ASV'){
    const a=2*Math.PI*Math.PI/60,RCe=p.R*p.C,MV=p.pct/100*0.1*p.ibw,Vd=0.0022*p.ibw,vtMin=0.0044*p.ibw,vtMax=0.015*p.ibw,fmax=Math.min(60,60/(3*RCe));
    let f=15;for(let i=0;i<40;i++){const VA=Math.max(0.5,MV-f*Vd);f=(Math.sqrt(1+2*a*RCe*VA/Vd)-1)/(a*RCe)}
    f=Math.min(fmax,Math.max(5,f));let Vt=MV/f;if(Vt<vtMin){Vt=vtMin;f=MV/Vt}if(Vt>vtMax){Vt=vtMax;f=MV/Vt}
    p.RR=f;p.VtT=Vt;p.Ti=Math.min(2,Math.max(RCe,60/f*0.33));asv={MV,Vd,RCe,f,Vt,fmax,vtMin,vtMax};
  }
  let V=0,phase='exp',tI=0,tE=-1,tLast=-99,peak=0,cur=null,pend=null,Pb=p.P0,state='control',sub=null,eaPk=0,eaPrev=0;
  const T=[],PAW=[],FLOW=[],VOL=[],PM=[],EA=[];
  const adaptive=['PRVC','VS','ASV','AUTO'].includes(p.mode);
  const start=(t,type)=>{
    let kind;
    if(p.mode==='PRVC')kind='pc';else if(p.mode==='VS'||p.mode==='VAPS')kind='ps';else if(p.mode==='PAV')kind='pav';else if(p.mode==='NAVA')kind='nava';
    else if(p.mode==='ASV')kind=type==='time'?'pc':'ps';
    else{if(state==='control'&&type==='trig')state='support';kind=state==='control'?'pc':'ps'}
    phase='insp';tI=t;tLast=t;peak=0;pend=null;sub=null;eaPk=0;
    cur={s:t,type,kind,P:Pb,v0:V,state,pmPk:0,pawPk:0};breaths.push(cur);
  };
  const end=t=>{phase='exp';tE=t;cur.e=t;cur.vt=V-cur.v0;
    if(adaptive&&cur.vt>0.02){const Cest=cur.vt/Math.max(1,cur.P),need=p.VtT/Cest;Pb=Math.min(p.Pmax-p.PEEP,Math.max(p.Pmin,Pb+Math.max(-3,Math.min(3,need-Pb))))}};
  for(let i=0,t=0;t<p.dur;i++,t=i*dt){
    const C=p.Cfn?p.Cfn(t):p.C,E=1/C,d=drive(t);
    const ea=p.mode==='NAVA'?1+d:0,pm=p.mode==='NAVA'?p.nme*d:d;
    const Palv=p.PEEP+V*E-pm;let paw,flow;
    if(phase==='exp'){
      flow=(p.PEEP-Palv)/(p.R+p.Rexp);paw=p.PEEP-p.Rexp*flow;
      const can=t-tE>p.refr;
      const pt=can&&(flow>p.trig||(p.mode==='NAVA'&&ea-1>0.5&&ea>eaPrev));
      if(pt)start(t,'trig');
      else if((p.mode==='PRVC'||p.mode==='ASV'||(p.mode==='AUTO'&&state==='control'))&&t-tLast>=60/p.RR)start(t,'time');
      else if(p.mode==='AUTO'&&state==='support'&&t-tLast>p.apnea){state='control';start(t,'time')}
    }else{
      const ti=t-tI;
      if(cur.kind==='pc'||cur.kind==='ps'){
        const cmd=p.PEEP+Pb*Math.min(1,ti/p.rise);
        if(sub==='vol'){flow=p.minFlow;paw=Palv+p.R*flow;if(V-cur.v0>=p.VtT){end(t)}}
        else{
          flow=(cmd-Palv)/(p.R+p.Rv);paw=cmd-p.Rv*flow;if(flow<0){flow=0;paw=Palv}
          if(flow>peak)peak=flow;
          if(cur.kind==='pc'){if(ti>=p.Ti)end(t)}
          else{
            if(p.mode==='VAPS'&&ti>0.1&&flow<=p.minFlow&&V-cur.v0<p.VtT){sub='vol';cur.topup=t}
            else{if(pend===null&&((ti>0.12&&flow<p.ETS*peak)||ti>3))pend=t+p.lag;if(pend!==null&&t>=pend)end(t)}
          }
          if(phase==='insp'&&sub!=='vol'&&paw>p.PEEP+Pb+3)end(t);
        }
      }else if(cur.kind==='pav'){
        flow=(pm/(1-p.g)-E*V)/p.R;if(flow<0)flow=0;paw=p.PEEP+p.g*(p.R*flow+E*V);
        if(flow>peak)peak=flow;if(ti>0.15&&flow<0.05*peak)end(t);
      }else{ // nava
        paw=p.PEEP+p.level*Math.max(0,ea-1);flow=(paw-Palv)/p.R;if(flow<0){flow=0;paw=Math.max(paw,Palv)}
        if(ea>eaPk)eaPk=ea;if(ti>0.1&&ea<eaPrev&&ea-1<0.7*(eaPk-1))end(t);
      }
      if(cur&&cur.e===undefined){cur.pmPk=Math.max(cur.pmPk,pm);cur.pawPk=Math.max(cur.pawPk,paw)}
    }
    eaPrev=ea;V+=flow*dt;
    if(i%2===0){T.push(t);PAW.push(paw);FLOW.push(flow*60);VOL.push(V*1000);PM.push(pm);EA.push(ea)}
  }
  if(cur&&cur.e===undefined){cur.e=p.dur;cur.vt=V-cur.v0}
  for(const e of efforts)e.trig=breaths.find(b=>b.type==='trig'&&b.s>=e.s-0.02&&b.s<=e.s+e.Ti);
  return {p,T,PAW,FLOW,VOL,PM,EA:p.mode==='NAVA'?EA:null,efforts,breaths,t0:p.dur-p.show,t1:p.dur,adv:true,asv};
}

function advCtx(sim){
  const {breaths,t0,t1}=sim,inW=t=>t>=t0+0.05&&t<=t1-0.05,bs=breaths.filter(b=>inW((b.s+b.e)/2));
  return {
    band:(a,b,l,c)=>[{k:'band',a,b,l,c}],
    plab:f=>bs.map(b=>({k:'txt',a:b.s,b:b.e,tr:'paw',l:f(b)})),
    lab:(tr,f)=>bs.map(b=>({k:'txt',a:b.s,b:b.e,tr,l:f(b)})),
    vlab:()=>bs.map(b=>({k:'txt',a:b.s,b:b.e,tr:'vol',l:Math.round(b.vt*1000)+''})),
    topup:()=>bs.filter(b=>b.topup).map(b=>({k:'band',a:b.topup,b:b.e,l:'volume 보충'})),
    ring:(tr,l)=>bs.map(b=>({k:'ring',t:b.s+0.03,tr,l})),
    states:()=>{const out=[];let s=null;for(const b of breaths){const key=b.kind==='pc'?'c':'s';if(!s||s.key!==key){if(s)out.push(s);s={key,a:b.s,b:b.e}}else s.b=b.e}if(s)out.push(s);
      return out.map(r=>({k:'band',a:r.a,b:r.b,l:r.key==='c'?'Control (PRVC)':'Support (VS)',c:r.key==='c'?'info':'ok'}))}
  };
}

function annCtx(sim){
  const {efforts,breaths,t0,t1}=sim, inW=t=>t>=t0+0.05&&t<=t1-0.05, out=[];
  const effEnd=e=>e.s+e.Ti;
  return {
    missed(lbl){efforts.filter(e=>!e.trig&&!e.inInsp&&inW(e.s+e.Ti*0.6)).forEach(e=>out.push({k:'ring',t:e.s+e.Ti*0.55,tr:'flow',l:lbl}));
      efforts.filter(e=>!e.trig&&!e.inInsp&&inW(e.s+e.Ti*0.6)).forEach(e=>out.push({k:'ring',t:e.s+e.Ti*0.55,tr:'paw',l:''}));return out},
    delay(){breaths.filter(b=>b.eff&&inW(b.s)&&b.s-b.eff.s>0.15).forEach(b=>out.push({k:'band',a:b.eff.s,b:b.s,l:'delay '+Math.round((b.s-b.eff.s)*1000)+'ms'}));return out},
    auto(){breaths.filter(b=>b.type==='auto'&&inW(b.s)).forEach(b=>out.push({k:'ring',t:b.s,tr:'paw',l:'effort 없음'}));return out},
    starve(){breaths.filter(b=>inW(b.s)).forEach(b=>out.push({k:'band',a:b.s,b:b.s+0.45,l:'scooped'}));return out},
    premature(){breaths.filter(b=>b.eff&&inW(b.e)&&effEnd(b.eff)>b.e+0.1).forEach(b=>out.push({k:'band',a:b.e,b:effEnd(b.eff),l:'환자 아직 흡기'}));return out},
    double(){for(let i=1;i<breaths.length;i++){const a=breaths[i-1],b=breaths[i];if(inW(b.s)&&b.eff&&b.eff===a.eff)out.push({k:'band',a:a.s,b:b.e,l:'effort 1 = breath 2'})}return out},
    delayed(){breaths.filter(b=>b.eff&&inW(b.e)&&b.e>effEnd(b.eff)+0.08).forEach(b=>{out.push({k:'band',a:effEnd(b.eff),b:b.e,l:'환자 멈춤'});out.push({k:'ring',t:b.e-0.02,tr:'paw',l:'spike'});out.push({k:'ring',t:effEnd(b.eff)+0.12,tr:'flow',l:'knee'})});return out},
    reverse(){efforts.filter(e=>e.entrained&&inW(e.s)).forEach(e=>out.push({k:'ring',t:e.s+0.25,tr:'paw',l:'기계→환자'}));
      for(let i=1;i<breaths.length;i++){const a=breaths[i-1],b=breaths[i];if(b.type==='trig'&&inW(b.s)&&b.eff&&b.eff.entrained)out.push({k:'band',a:a.s,b:b.e,l:'stacked'})}return out}
  };
}

    if(p.ih&&k===p.ih.n){segs.push({k,ty:'ih',a:t,b:t+p.ih.d});t+=p.ih.d}

  if(p.eff)segs.filter(s=>s.ty==='insp').forEach(s=>effs.push({s:s.a-0.04,Ti:p.eff.Ti,A:p.eff.A}));

  const pmAt=t=>{let v=0;for(const e of effs){const u=t-e.s;if(u<0||u>e.Ti+0.4)continue;v+=u<e.Ti?e.A*Math.sin(Math.PI/2*u/e.Ti):e.A*Math.cos(Math.PI/2*(u-e.Ti)/0.4)}return v};

  for(t=segs[0].a;t<p.dur;i++,t=segs[0].a+i*dt){

      if(s.ty==='ih'){M.pplat=paw;M.ih=[s.a,s.b]}

  if(pl!=null)add('Pplat',pl,'cmH₂O',pl<=25?'ok':pl<=30?'warn':'bad',pl<=25?'여유 있음':pl<=30?'허용 상한':'> 30: overdistension 위험 → Vt↓',1);
  if(pl!=null&&peep!=null){const dp=pl-peep;add('ΔP',dp,'cmH₂O',dp<=14?'ok':dp<=15?'warn':'bad',(dp<=14?'양호':dp<=15?'ARDS 상한':'> 15: Vt↓, PEEP 조정, prone 고려')+(pt==null?' · set PEEP 기준 (PEEPtot 넣으면 정확)':''),1);
    if(vt!=null&&dp>0){const c=vt/dp;add('Cstat',c,'mL/cmH₂O',c>=50?'ok':c>=30?'warn':'bad',c>=50?'정상 범위':c>=30?'경도 감소':'심한 감소: baby lung → Vt 더 낮추기')}}
  if(pk!=null&&pl!=null){const d=pk-pl;add('Ppeak − Pplat',d,'cmH₂O',d<5?'ok':d<=10?'warn':'bad',d<5?'기도저항 정상':d<=10?'경도 저항↑':'저항↑: suction, 기관지확장제, tube 확인',1)}

    if(pk!=null&&peep!=null){const d=(pk-peep)+2/3*o;add('ΔPL,dyn',d,'cmH₂O',d<=15?'ok':d<=20?'warn':'bad',d<=15?'자발호흡 포함 폐 stress 양호':d<=20?'경계':'폐 stress 과다',1)}}
  if(p01!=null)add('P0.1',p01,'cmH₂O',p01<1?'bad':p01<1.5?'warn':p01<=3.5?'ok':p01<=5?'warn':'bad',p01<1?'drive 매우 낮음: 과진정, PS 과다':p01<1.5?'낮은 편':p01<=3.5?'적정':p01<=5?'drive 높음: under-assist, 통증, 산증':'매우 높음: P-SILI 위험',1);

  if(sim&&sim.hold){const p=sim.p,M=sim.M;
    let h=`<span>${p.mode==='VC'?`Vt ${Math.round(p.Vt*1000)} · PEEP ${p.PEEP} · RR ${p.RR}`:`PC ${p.P} / PEEP ${p.PEEP} · Ti ${p.Ti}s · RR ${p.RR}`}</span>`;
    h+=`<span>Ppeak <b>${r0(M.ppeak)}</b></span>`;if(M.pplat!=null)h+=`<span>Pplat <b>${r0(M.pplat)}</b></span>`;
    if(M.peeptot!=null)h+=`<span>PEEPtot <b>${r0(M.peeptot)}</b></span>`;if(M.pocc!=null)h+=`<span class="hid">Pocc <b>${r0(M.pocc)}</b></span>`;
    if(M.p01!=null)h+=`<span class="hid">P0.1 <b>${r1(M.p01)}</b></span>`;h+=`<span>Vt <b>${Math.round(M.vt)}</b> mL</span>`;
    $('#mode').textContent=p.mode==='VC'?'VC (A/C)':'PC (A/C)';$('#readout').innerHTML=h;return}
  if(sim.adv){const e=ADV[st.aidx],p=sim.p,bs=sim.breaths.filter(b=>b.s>=sim.t0&&b.s<sim.t1),es=sim.efforts.filter(x=>x.s>=sim.t0&&x.s<sim.t1);
    const rr=Math.round(bs.length*60/(sim.t1-sim.t0)),vt=Math.round(bs.reduce((a,b)=>a+(b.vt||0),0)/Math.max(1,bs.length)*1000);
    let h=`<span>${e.set(p)}</span><span>RR <b>${rr}</b></span><span>Vt <b>${vt}</b> mL</span>`;
    if(st.pmus||sim.EA)h+=`<span class="hid">환자 effort <b>${Math.round(es.length*60/(sim.t1-sim.t0))}</b>/min</span>`;
    $('#mode').textContent=e.name;$('#readout').innerHTML=h;return}
  const p=sim.p,bs=sim.breaths.filter(b=>b.s>=sim.t0&&b.s<sim.t1),es=sim.efforts.filter(e=>e.s>=sim.t0&&e.s<sim.t1);
  const rr=Math.round(bs.length*60/(sim.t1-sim.t0)),vt=Math.round(bs.reduce((a,b)=>a+(b.vt||0),0)/Math.max(1,bs.length)*1000);
  const set=p.mode==='PSV'?`PS ${p.P} / PEEP ${p.PEEP} · ETS ${Math.round(p.ETS*100)}%`:`Pinsp ${p.P} / PEEP ${p.PEEP} · Ti ${p.Ti}s · RR ${p.RR}`;
  let h=`<span>${set}</span><span>RR <b>${rr}</b></span><span>Vt <b>${vt}</b> mL</span>`;
  if(st.pmus) h+=`<span class="hid">환자 effort <b>${Math.round(es.length*60/(sim.t1-sim.t0))}</b>/min</span>`;
  $('#mode').textContent=p.mode==='PSV'?'PSV':'PCV (A/C)';$('#readout').innerHTML=h;
}
function chips(){
  $('#chips').hidden=st.tab==='quiz';
  if(st.tab==='hold'){$('#chips').innerHTML=HOLD.map((s,i)=>`<button type="button" class="chip${i===st.hidx?' on':''}" data-h="${i}">${s.name}<small>${s.sub}</small></button>`).join('');const on=$('#chips .on');if(on)on.scrollIntoView({inline:'center',block:'nearest'});return}
  if(st.tab==='adv'){$('#chips').innerHTML=ADV.map((s,i)=>`<button type="button" class="chip${i===st.aidx?' on':''}" data-a="${i}">${s.name}</button>`).join('');const on=$('#chips .on');if(on)on.scrollIntoView({inline:'center',block:'nearest'});return}
  $('#chips').innerHTML=S.map((s,i)=>`<button type="button" class="chip${i===st.idx?' on':''}" data-i="${i}">${s.name}<small>${s.mode}</small></button>`).join('');
  const on=$('#chips .on');if(on)on.scrollIntoView({inline:'center',block:'nearest'});
}
function infoHTML(s){
  const list=(a,tag='ul')=>a.length?`<${tag}>${a.map(x=>`<li>${x}</li>`).join('')}</${tag}>`:'';
  return `<div class="title"><h2>${s.name}</h2><span class="en">${s.en}</span><span class="tag">${s.mode}</span></div>
  <p class="one">${s.one}</p>
  <div class="cols">
    <div class="sec"><h3>파형 단서</h3>${list(s.clues)}</div>
    ${s.cause.length?`<div class="sec"><h3>원인</h3>${list(s.cause)}</div>`:''}
    ${s.fix.length?`<div class="sec fix"><h3>대처 (순서대로)</h3>${list(s.fix,'ol')}</div>`:''}
  </div>
  ${s.pit?`<div class="pit">${s.pit}</div>`:''}`;
}
function render(){
  document.querySelectorAll('.seg button').forEach(b=>b.classList.toggle('on',b.dataset.tab===st.tab));
  chips();
  $('#tgAnn').classList.toggle('on',st.ann);$('#tgPmus').classList.toggle('on',st.pmus);
  readout(st.sim);
  $('#asvBox').hidden=!(st.tab==='adv'&&ADV[st.aidx].lung);
  $('.monitor').hidden=st.tab==='hold'&&!!HOLD[st.hidx].calc;
  if(st.tab==='hold'){
    st.showAnn=true;const e=HOLD[st.hidx];
    $('#info').innerHTML=(e.calc?calcHTML():holdHTML(e))+`<div class="nav"><button type="button" class="btn" data-hnav="-1" ${st.hidx===0?'disabled':''}>← 이전</button><button type="button" class="btn go" data-hnav="1" ${st.hidx===HOLD.length-1?'disabled':''}>다음 →</button></div>`;
    if(e.calc)calcRender();
    return;
  }
  if(st.tab==='adv'){
    st.showAnn=true;const e=ADV[st.aidx];
    $('#info').innerHTML=advHTML(e)+`<div class="nav"><button type="button" class="btn" data-anav="-1" ${st.aidx===0?'disabled':''}>← 이전</button><button type="button" class="btn go" data-anav="1" ${st.aidx===ADV.length-1?'disabled':''}>다음 →</button></div>`;
    if(e.lung)$('#lungs').innerHTML=Object.entries(LUNG).map(([k,v])=>`<button type="button" class="tg${st.lung===k?' on':''}" data-lung="${k}">${v.l} (RCexp ${(v.R*v.C).toFixed(1)}s)</button>`).join('');
    return;
  }
  if(st.tab==='atlas'){
    st.showAnn=true;
    $('#info').innerHTML=infoHTML(S[st.idx])+`<div class="nav"><button type="button" class="btn" data-nav="-1" ${st.idx===0?'disabled':''}>← 이전</button><button type="button" class="btn go" data-nav="1" ${st.idx===S.length-1?'disabled':''}>다음 →</button></div>`;
  }else{
    const q=st.quiz;st.showAnn=q.answered;
    let h=`<div class="nav" style="align-items:center"><p class="quizq">이 파형의 이상은?</p><span class="score">${st.score[0]} / ${st.score[1]}</span></div>
    <div class="choices">${q.opts.map(i=>{let c='';if(q.answered){if(i===q.idx)c=' right';else if(i===q.pick)c=' wrong'}return `<button type="button" class="choice${c}" data-pick="${i}" ${q.answered?'disabled':''}>${S[i].name}</button>`}).join('')}</div>`;
    if(!q.answered)h+=`<p class="hint">힌트: 「환자 effort (Pmus)」를 켜면 실제 모니터에는 없는 환자 근육 신호가 보여.</p>`;
    else h+=infoHTML(S[q.idx])+`<div class="nav"><span></span><button type="button" class="btn go" data-next="1">다음 문제 →</button></div>`;
    $('#info').innerHTML=h;
  }
}
function load(i){st.idx=i;st.sim=simulate(S[i].cfg);render();animate()}
function loadAdv(i){st.aidx=i;const e=ADV[i];st.pmus=e.pm;const c=Object.assign({},e.cfg,e.lung?LUNG[st.lung]:{});st.sim=simAdv(c);render();animate()}
function advHTML(e){
  const list=a=>`<ul>${a.map(x=>`<li>${x}</li>`).join('')}</ul>`;
  return `<div class="title"><h2>${e.name}</h2><span class="en">${e.en}</span></div>
  <p class="one">${e.one}</p>
  <div class="sec"><h3>이 파형에서 볼 것</h3>${list(e.watch)}</div>
  <div class="how"><b>작동 원리</b>${list(e.how)}</div>
  <div class="cols">
    <div class="sec good"><h3>적응증</h3>${list(e.indic)}</div>
    <div class="sec bad"><h3>금기 · 피할 때</h3>${list(e.contra)}</div>
    <div class="sec"><h3>한계 · 함정</h3>${list(e.limits)}</div>
    <div class="sec"><h3>모니터링</h3>${list(e.mon)}</div>
    <div class="sec fix"><h3>Weaning 지표</h3>${list(e.wean)}</div>
  </div>`;
}
function drawASV(sim){
  const cvA=document.getElementById('asv'),c=cvA.getContext('2d'),a=sim.asv,dpr=Math.max(1,devicePixelRatio||1),W=cvA.clientWidth,H=200;
  cvA.style.height=H+'px';cvA.width=Math.round(W*dpr);cvA.height=Math.round(H*dpr);c.setTransform(dpr,0,0,dpr,0,0);c.clearRect(0,0,W,H);
  const L=46,B=H-22,T0=8,Rr=10,fMax=Math.max(40,a.fmax+5),vMax=a.vtMax*1000*1.1;
  const X=f=>L+f/fMax*(W-L-Rr),Y=v=>B-v/vMax*(B-T0);
  c.strokeStyle='#1B2438';c.lineWidth=1;c.font='9px ui-monospace,Menlo,monospace';c.fillStyle='#55617A';
  for(let f=0;f<=fMax;f+=10){c.beginPath();c.moveTo(X(f),T0);c.lineTo(X(f),B);c.stroke();c.fillText(f,X(f)-4,B+12)}
  for(let v=0;v<=vMax;v+=200){c.beginPath();c.moveTo(L,Y(v));c.lineTo(W-Rr,Y(v));c.stroke();c.fillText(v,L-26,Y(v)+3)}
  c.fillText('RR (/min)',W-Rr-52,B-4);c.save();c.translate(10,T0+60);c.rotate(-Math.PI/2);c.fillText('Vt (mL)',0,0);c.restore();
  c.fillStyle='rgba(90,140,255,0.12)';c.strokeStyle='rgba(90,140,255,0.7)';
  const bx=X(5),by=Y(a.vtMax*1000),bw=X(a.fmax)-X(5),bh=Y(a.vtMin*1000)-Y(a.vtMax*1000);c.fillRect(bx,by,bw,bh);c.strokeRect(bx,by,bw,bh);
  c.strokeStyle='#8FA8FF';c.setLineDash([4,3]);c.beginPath();let first=true;for(let f=3;f<=fMax;f+=0.5){const v=a.MV/f*1000;if(v>vMax)continue;first?c.moveTo(X(f),Y(v)):c.lineTo(X(f),Y(v));first=false}c.stroke();c.setLineDash([]);
  const bs=sim.breaths.filter(b=>b.s>=sim.t0&&b.e<sim.t1).slice(-4),rr=sim.breaths.filter(b=>b.s>=sim.t1-10).length*6,vt=bs.reduce((s,b)=>s+b.vt,0)/Math.max(1,bs.length)*1000;
  c.strokeStyle='#6FCF97';c.lineWidth=2.5;const tx=X(a.f),ty=Y(a.Vt*1000);c.beginPath();c.moveTo(tx-7,ty);c.lineTo(tx+7,ty);c.moveTo(tx,ty-7);c.lineTo(tx,ty+7);c.stroke();
  c.fillStyle='#F2C94C';c.beginPath();c.arc(X(rr),Y(vt),5,0,Math.PI*2);c.fill();
  c.font='600 10px -apple-system,system-ui,sans-serif';c.fillStyle='#6FCF97';c.fillText('목표',tx+9,ty-6);c.fillStyle='#F2C94C';c.fillText('현재',X(rr)+8,Y(vt)+12);
  c.fillStyle='#8FA8FF';c.fillText('안전 박스',bx+4,by+12);
  $('#asvCap').innerHTML=`<span>목표 MV <b>${a.MV.toFixed(1)}</b> L/min</span><span>RCexp <b>${a.RCe.toFixed(2)}</b>s</span><span>목표 RR <b>${a.f.toFixed(0)}</b></span><span>목표 Vt <b>${Math.round(a.Vt*1000)}</b> mL</span>`;
}
function newQuiz(){
  const pool=S.map((_,i)=>i);let idx;do{idx=pool[Math.floor(Math.random()*pool.length)]}while(st.quiz&&idx===st.quiz.idx);
  const others=pool.filter(i=>i!==idx).sort(()=>Math.random()-.5).slice(0,3);
  st.quiz={idx,opts:[idx,...others].sort(()=>Math.random()-.5),answered:false,pick:null};st.pmus=false;load(idx);
}
document.addEventListener('click',e=>{
  const t=e.target.closest('button');if(!t)return;
  if(t.dataset.tab){st.tab=t.dataset.tab;if(st.tab==='quiz')newQuiz();else if(st.tab==='adv')loadAdv(st.aidx);else if(st.tab==='hold')loadHold(st.hidx);else{st.pmus=false;load(st.idx)}return}
  if(t.dataset.a!==undefined){loadAdv(+t.dataset.a);return}
  if(t.dataset.anav){loadAdv(Math.min(ADV.length-1,Math.max(0,st.aidx+ +t.dataset.anav)));window.scrollTo({top:0,behavior:'smooth'});return}
  if(t.dataset.lung){st.lung=t.dataset.lung;loadAdv(st.aidx);return}
  if(t.dataset.h!==undefined){loadHold(+t.dataset.h);return}
  if(t.dataset.hnav){loadHold(Math.min(HOLD.length-1,Math.max(0,st.hidx+ +t.dataset.hnav)));window.scrollTo({top:0,behavior:'smooth'});return}
  if(t.dataset.creset){st.cv={};render();return}
  if(t.dataset.i!==undefined){load(+t.dataset.i);return}
  if(t.dataset.nav){load(Math.min(S.length-1,Math.max(0,st.idx+ +t.dataset.nav)));window.scrollTo({top:0,behavior:'smooth'});return}
  if(t.dataset.pick!==undefined){const q=st.quiz;q.pick=+t.dataset.pick;q.answered=true;st.score[1]++;if(q.pick===q.idx)st.score[0]++;render();draw();return}
  if(t.dataset.next){newQuiz();window.scrollTo({top:0,behavior:'smooth'});return}
  if(t.id==='tgAnn'){st.ann=!st.ann;render();draw();return}
  if(t.id==='tgPmus'){st.pmus=!st.pmus;render();draw();return}
  if(t.id==='tgReplay'){animate();return}
});
let rt;addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(draw,120)});
window.__S=S;window.__sim=simulate;window.__ADV=ADV;window.__simAdv=simAdv;
load(0);
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
})();
</script>
